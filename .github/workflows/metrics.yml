name: Metrics
on:
  # Atualiza a cada 24 horas
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente se quiser
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Seu token pessoal do GitHub (precisa criar um em Settings > Developer Settings)
          token: ${{ secrets.METRICS_TOKEN }}
          user: Guilherme-Pelissari
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
