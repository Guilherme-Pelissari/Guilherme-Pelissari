name: Metrics
on:
  # Atualiza todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Guilherme-Pelissari
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # --- A Mágica Visual Começa Aqui ---
          
          # Tema escuro e moderno (Dracula)
          config_theme: dracula
          
          # Barra de Linguagens (Top Langs)
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          
          # Aquele gráfico 3D isométrico (Fica muito top!)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Badges de conquistas (Compacto para não poluir)
          plugin_achievements: yes
          plugin_achievements_display: compact
